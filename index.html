<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wi-Fi Access</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    /* Gradient Background */
    @keyframes monoGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating & Border Pulse */
    @keyframes glassBorderGlow {
      0%, 100% {
        border-color: rgba(255, 255, 255, 0.18);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      }
      50% {
        border-color: rgba(255, 255, 255, 0.35);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 255, 255, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.3);
      }
    }

    /* Entrance Animation */
    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Hologram Pulse Animation */
    @keyframes holoPulse {
      0%, 100% {
        filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.4));
        transform: scale(1);
      }
      50% {
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
        transform: scale(1.04);
      }
    }

    body {
      background: linear-gradient(-45deg, #0b0f19, #171f30, #090c14, #1a2336);
      background-size: 400% 400%;
      animation: monoGradient 14s ease infinite;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }

    .glass-card {
      background: rgba(18, 24, 38, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: glassBorderGlow 8s infinite ease-in-out, cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }

    .glass-input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
    }

    .holo-glow {
      animation: holoPulse 3s infinite ease-in-out;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-6">

  <!-- PAGE LOGIN / HALAMAN DEPAN -->
  <div id="page-login" class="glass-card w-full max-w-md p-7 sm:p-8 rounded-3xl text-center relative overflow-hidden">
    
    <!-- Header Controls -->
    <div class="flex justify-between items-center mb-6">
      <span class="text-[11px] font-semibold tracking-wider text-gray-400 uppercase bg-white/5 px-3 py-1 rounded-full border border-white/10">
        NETWORK
      </span>
      <!-- IKON ADMIN: PROFIL GARIS CAHAYA -->
      <button onclick="openAdminAuthModal()" class="flex items-center gap-1.5 text-xs font-medium px-3.5 py-1.5 bg-white/10 hover:bg-white/20 text-gray-300 rounded-full border border-white/20 backdrop-blur-md transition-all active:scale-95 shadow-sm">
        <svg class="w-4 h-4 text-white drop-shadow-[0_0_3px_rgba(255,255,255,0.8)]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
        </svg>
      </button>
    </div>

    <!-- IKON UTAMA: SINYAL HOLOGRAM METEOR / TOWER -->
    <div class="w-20 h-20 bg-white/10 text-white rounded-3xl flex items-center justify-center mx-auto mb-5 border border-white/20 backdrop-blur-xl shadow-2xl holo-glow">
      <svg class="w-10 h-10 text-white drop-shadow-[0_0_6px_rgba(255,255,255,0.9)]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19.5v-15m0 0l-3.75 3.75M12 4.5l3.75 3.75"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9.75a5.25 5.25 0 017.5 0M5.25 6.75a9.75 9.75 0 0113.5 0M12 21a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/>
      </svg>
    </div>

    <h1 class="text-2xl font-bold tracking-tight text-white mb-1">Wi-Fi Portal 2</h1>
    <p class="text-xs text-gray-400 mb-6 font-medium">Masukkan password untuk terhubung ke jaringan</p>

    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <input type="password" id="password" placeholder="Masukkan Kode Akses..." required
          class="glass-input w-full px-4 py-3.5 rounded-2xl focus:outline-none text-sm text-white placeholder-gray-500 font-medium tracking-wide" />
      </div>
      <button type="submit"
        class="w-full bg-white text-gray-950 hover:bg-gray-200 font-semibold py-3.5 rounded-2xl transition-all duration-200 shadow-xl hover:shadow-white/10 active:scale-[0.98]">
        Masuk Jaringan
      </button>
    </form>
  </div>

  <!-- PAGE WIFI / HALAMAN INFORMASI WIFI -->
  <div id="page-wifi" class="glass-card w-full max-w-md p-7 sm:p-8 rounded-3xl text-center hidden relative">
    
    <!-- Top Header -->
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-2.5">
        <!-- IKON NETWORK: SINYAL HOLOGRAM -->
        <div class="holo-glow w-9 h-9 rounded-full bg-white/10 text-white border border-white/20 flex items-center justify-center backdrop-blur-md">
          <svg class="w-5 h-5 text-white drop-shadow-[0_0_4px_rgba(255,255,255,0.8)]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9.75a5.25 5.25 0 017.5 0M5.25 6.75a9.75 9.75 0 0113.5 0M12 21a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/>
          </svg>
        </div>
        <span class="text-xs font-semibold text-gray-300 tracking-wider">WI-FI HOST</span>
      </div>

      <!-- IKON ADMIN: PROFIL GARIS CAHAYA -->
      <button onclick="openAdminAuthModal()" class="flex items-center gap-1.5 text-xs font-medium px-3.5 py-1.5 bg-white/10 hover:bg-white/20 text-gray-300 rounded-full border border-white/20 backdrop-blur-md transition-all active:scale-95">
        <svg class="w-4 h-4 text-white drop-shadow-[0_0_3px_rgba(255,255,255,0.8)]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
        </svg>
      </button>
    </div>

    <!-- QR Code Section -->
    <div class="bg-white/5 p-4 rounded-2xl border border-white/10 mb-6 backdrop-blur-md inline-block">
      <div id="qrcode" class="flex justify-center p-3 bg-white rounded-xl shadow-md"></div>
      
      <!-- IKON UNDUH: HOLOGRAM GARIS (CYBER-LINE DOWNLOAD) -->
      <button onclick="downloadQRCode()" class="mt-3 text-xs bg-white/10 hover:bg-white/20 text-white font-medium px-4 py-2 rounded-xl border border-white/15 transition-all flex items-center justify-center gap-2 mx-auto active:scale-95">
        <svg class="w-4 h-4 text-white drop-shadow-[0_0_3px_rgba(255,255,255,0.8)]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M7.5 12l4.5 4.5m0 0l4.5-4.5M12 16.5v-13.5"/>
        </svg>
        Unduh QR Code
      </button>
    </div>

    <!-- Info Detail Wi-Fi Card Layout -->
    <div class="space-y-3.5 text-left mb-6">
      <div class="p-3.5 rounded-2xl bg-white/[0.03] border border-white/10">
        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">Nama Jaringan (SSID)</span>
        <input type="text" id="wifi-ssid" readonly
          class="w-full bg-transparent text-white font-bold text-sm focus:outline-none" />
      </div>

      <div class="p-3.5 rounded-2xl bg-white/[0.03] border border-white/10 flex items-center justify-between gap-2">
        <div class="w-full">
          <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">Kata Sandi</span>
          <input type="text" id="wifi-pass" readonly
            class="w-full bg-transparent text-white font-bold text-sm focus:outline-none" />
        </div>
        <button onclick="copyPassword()" class="bg-white/10 hover:bg-white/20 text-white px-3.5 py-2 rounded-xl text-xs font-medium transition border border-white/15 shrink-0 active:scale-95">
          Salin
        </button>
      </div>
    </div>

    <button onclick="handleLogout()" class="w-full bg-white/5 hover:bg-red-500/10 text-gray-400 hover:text-red-400 font-medium py-3 rounded-2xl border border-white/10 hover:border-red-500/20 transition-all text-xs active:scale-95">
      Keluar
    </button>
  </div>

  <!-- MODAL ADMIN AUTH -->
  <div id="modal-admin-auth" class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center p-4 hidden z-50">
    <div class="glass-card w-full max-w-sm p-6 rounded-3xl text-center shadow-2xl">
      <h3 class="text-base font-semibold text-white mb-1">Akses Admin</h3>
      <p class="text-xs text-gray-400 mb-4">Masukkan kata sandi untuk mengubah data</p>
      <input type="password" id="admin-pass" placeholder="Password Admin..."
        class="glass-input w-full px-4 py-3 rounded-xl mb-4 focus:outline-none text-sm text-white placeholder-gray-500 font-medium" />
      <div class="flex gap-2">
        <button onclick="closeModal('modal-admin-auth')" class="w-1/2 bg-white/10 hover:bg-white/20 text-gray-300 py-2.5 rounded-xl text-xs font-medium transition">Batal</button>
        <button onclick="verifyAdminPassword()" class="w-1/2 bg-white text-gray-950 hover:bg-gray-200 py-2.5 rounded-xl text-xs font-semibold transition">Verifikasi</button>
      </div>
    </div>
  </div>

  <!-- MODAL ADMIN CONFIG -->
  <div id="modal-admin-config" class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center p-4 hidden z-50">
    <div class="glass-card w-full max-w-sm p-6 rounded-3xl text-left shadow-2xl">
      <h3 class="text-base font-semibold text-white mb-4">Pengaturan Wi-Fi 2</h3>
      <div class="space-y-3.5 mb-6">
        <div>
          <label class="text-xs font-medium text-gray-400">SSID Baru</label>
          <input type="text" id="edit-ssid" class="glass-input w-full px-3.5 py-2.5 rounded-xl mt-1 focus:outline-none text-sm text-white font-medium" />
        </div>
        <div>
          <label class="text-xs font-medium text-gray-400">Password Baru</label>
          <input type="text" id="edit-pass" class="glass-input w-full px-3.5 py-2.5 rounded-xl mt-1 focus:outline-none text-sm text-white font-medium" />
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="closeModal('modal-admin-config')" class="w-1/2 bg-white/10 hover:bg-white/20 text-gray-300 py-2.5 rounded-xl text-xs font-medium transition">Batal</button>
        <button onclick="saveWifiConfig()" class="w-1/2 bg-white text-gray-950 hover:bg-gray-200 py-2.5 rounded-xl text-xs font-semibold transition">Simpan</button>
      </div>
    </div>
  </div>

  <!-- FIREBASE & LOGIC SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCoK2cQGelo16fQ-zXEte2GfFivyOXYQsk",
      authDomain: "my-page-489f5.firebaseapp.com",
      databaseURL: "https://my-page-489f5-default-rtdb.firebaseio.com",
      projectId: "my-page-489f5",
      storageBucket: "my-page-489f5.firebasestorage.app",
      messagingSenderId: "632587000538",
      appId: "1:632587000538:web:bd331ca49acd265154e3e3",
      measurementId: "G-DSVY49TTCB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    // PATH KHUSUS WIFI 2
    const wifiRef = ref(db, 'wifiConfig2');

    window.currentSSID = "WIFI_MONO_GLASS_2";
    window.currentPASS = "kopi1234";

    const USER_HASH_TARGET = "d7b79571c74be9e3ca40bb836315fe8acca4885c0e0719eb8eeebea155da98fc";
    const ADMIN_HASH_TARGET = "2d7532e279254ca6bf0cd7954e1baf659975803338dfbc9d31058d5e8009f7ea";

    const pageLogin = document.getElementById("page-login");
    const pageWifi = document.getElementById("page-wifi");
    const ssidInput = document.getElementById("wifi-ssid");
    const passInput = document.getElementById("wifi-pass");
    const qrContainer = document.getElementById("qrcode");

    let qrcode = new QRCode(qrContainer, { width: 120, height: 120 });

    function generateQRCode() {
      const qrData = `WIFI:S:${window.currentSSID};T:WPA;P:${window.currentPASS};;`;
      qrcode.clear();
      qrcode.makeCode(qrData);
    }

    window.downloadQRCode = function() {
      const img = qrContainer.querySelector("img");
      if (img && img.src) {
        const link = document.createElement("a");
        link.href = img.src;
        link.download = `QRCode-${window.currentSSID}.png`;
        link.click();
      } else {
        alert("QR Code belum siap untuk diunduh.");
      }
    };

    onValue(wifiRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        window.currentSSID = data.ssid || "WIFI_MONO_GLASS_2";
        window.currentPASS = data.pass || "kopi1234";
      }
      ssidInput.value = window.currentSSID;
      passInput.value = window.currentPASS;
      generateQRCode();
    });

    window.copyPassword = function() {
      navigator.clipboard.writeText(window.currentPASS);
      alert(`Password "${window.currentPASS}" berhasil disalin!`);
    };

    async function hashSHA256(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    window.handleLogin = async function(event) {
      event.preventDefault();
      const inputPass = document.getElementById("password").value;
      const hashedInput = await hashSHA256(inputPass);

      if (hashedInput === USER_HASH_TARGET) {
        generateQRCode();
        pageLogin.classList.add("hidden");
        pageWifi.classList.remove("hidden");
      } else {
        alert("Password Akses Salah!");
      }
    };

    window.handleLogout = function() {
      document.getElementById("password").value = "";
      pageWifi.classList.add("hidden");
      pageLogin.classList.remove("hidden");
    };

    window.openAdminAuthModal = function() {
      document.getElementById("admin-pass").value = "";
      document.getElementById("modal-admin-auth").classList.remove("hidden");
    };

    window.closeModal = function(modalId) {
      document.getElementById(modalId).classList.add("hidden");
    };

    window.verifyAdminPassword = async function() {
      const inputPass = document.getElementById("admin-pass").value;
      const hashedInput = await hashSHA256(inputPass);

      if (hashedInput === ADMIN_HASH_TARGET) {
        window.closeModal("modal-admin-auth");
        document.getElementById("edit-ssid").value = window.currentSSID;
        document.getElementById("edit-pass").value = window.currentPASS;
        document.getElementById("modal-admin-config").classList.remove("hidden");
      } else {
        alert("Password Admin Salah / Akses Ditolak!");
      }
    };

    window.saveWifiConfig = function() {
      const newSSID = document.getElementById("edit-ssid").value.trim();
      const newPass = document.getElementById("edit-pass").value.trim();

      if (!newSSID || !newPass) {
        alert("SSID dan Password tidak boleh kosong!");
        return;
      }

      set(wifiRef, {
        ssid: newSSID,
        pass: newPass
      }).then(() => {
        window.closeModal("modal-admin-config");
        alert("Konfigurasi Wi-Fi Berhasil Disimpan!");
      }).catch((error) => {
        alert("Gagal menyimpan ke Firebase: " + error.message);
      });
    };
  </script>
</body>
</html>
